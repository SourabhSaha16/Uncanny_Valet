name: CI/CD

# Local-build route: the Web player is built on a developer PC (tools/build-web.ps1), which copies it
# into the committed site/ folder. CI checks changelogs and publishes to GitHub Pages: the committed site/ of
# `main` (stable, the playtesters' link) at the root and the site/ of `pivot/chaos` (beta) under /beta/.
# No Unity license or secrets are needed in CI.

on:
  push:
    branches: [main, pivot/chaos]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changelog:
    name: Changelog entry in every commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check changelogs
        run: bash tools/check-changelog.sh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  deploy:
    name: Publish stable (main) at / and beta (pivot/chaos) at /beta/
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/pivot/chaos')
    needs: changelog
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: stable
      - uses: actions/checkout@v4
        with:
          ref: pivot/chaos
          path: beta
      - name: Assemble the site (stable at the root, beta under /beta/)
        run: |
          for d in stable beta; do
            if [ ! -f "$d/site/index.html" ]; then
              echo "::error::$d/site/index.html is missing. Run tools/build-web.ps1 locally and commit site/ on that branch."
              exit 1
            fi
          done
          mkdir -p _site/beta
          cp -r stable/site/. _site/
          cp -r beta/site/. _site/beta/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
